    <body>

        <div class="one" id="1">

        </div>
        <div class="font-ui">
            <img src="/pics/fsize.png" class="font-image" alt="Adjust the size of text">
            
            <div class="font-signs">
                <button class="sign-btn" onclick="changeFontSize(0.1)">+</button>
                <button class="sign-btn" onclick="changeFontSize(-0.1)">-</button>
            </div>
        </div>
        
        <a href="/index.html"title="Go back"> <img src="/pics/left.png" class="a_toc"></a>
          
        <div class="font-ui">
            <img src="/pics/fsize.png" class="font-image" alt="Adjust the size of text">
            
            <div class="font-signs">
                <button class="sign-btn" onclick="changeFontSize(0.1)">+</button>
                <button class="sign-btn" onclick="changeFontSize(-0.1)">-</button>
            </div>
        </div>
        
        <div class="book-wrapper">
            <div class="two" id="2">
                <p>Table of Contents</p>
                <br>
                <!--<a href="/gander.htm" title="Everything in one place!"> Look around! </a><br>--->
                <a href="/mem.htm" title="Look at events, history, people"> Memories & Moments </a><br>
                <a href="/academics.htm" title="Your academic archive"> Academics </a><br>
                <a href="/comments.htm" title = "Your friends' and faculty's notes"> Notes & Quotes </a><br>
                <a href="/pictures.htm" title="Look at all media of the yearbook"> Pictures & Media </a><br>
                <a href="/update.htm" title="Upload something of your own!"> Update </a><br>
            </div>
        </div>
    
        <div>
            <img src="/pics/clanker.png" class="ai" onclick="openAI()" style="cursor:pointer;" title="Click for help!">
        </div>
        <div id="ai-overlay" class="overlay-hidden">
            <div class="ai-modal">
                <div class="ai-interaction-zone">
                    <img src="/pics/clanker_neutral.png" id="clanker-display" class="ai-large">
                    
                    <div id="ai-options" class="options-vertical">
                        </div>
                </div>
        
                <div class="ai-dialogue">
                    <p id="ai-text">Hello, dear allumni! How could I assist you?</p>
                </div>
        
                <button onclick="closeAI()" class="close-btn">Return to Book</button>
            </div>
        </div>
    
        <div class="book-wrapper">
            <div class="scroll3">
                <form action="/search.htm" method="GET">
                    <input type="text" name="q" placeholder="Begin the search">
                    <button type="submit">Search</button>
                </form>
            </div>
        </div>
        <div class="book-wrapper">
            <div class="quote">
                <img src="/pics/quote.png" style="width:180px;height:180px;">
            </div>
        </div>
        <script src="/script.js"></script>
    </body>
